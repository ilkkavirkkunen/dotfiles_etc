# If a config.py file exists, this file is ignored unless it's explicitly loaded
# via config.load_autoconfig(). For more information, see:
# https://github.com/qutebrowser/qutebrowser/blob/main/doc/help/configuring.asciidoc#loading-autoconfigyml
# DO NOT edit this file by hand, qutebrowser will overwrite it.
# Instead, create a config.py - see :help for details.

config_version: 2
settings:
  bindings.commands:
    global:
      normal:
        <Ctrl+b>: scroll-page 0 -0.8
        <Ctrl+f>: scroll-page 0 0.8
        <Ctrl+h>: scroll left
        <Ctrl+j>: scroll down
        <Ctrl+k>: scroll up
        <Ctrl+l>: scroll right
        j: scroll-page 0 0.3
        k: scroll-page 0 -0.3
  completion.cmd_history_max_items:
    global: 1000
  completion.height:
    global: 40%
  content.autoplay:
    global: false
  content.geolocation:
    https://kartta.paikkatietoikkuna.fi: false
    https://www.biltema.fi: false
    https://www.fonecta.fi: false
  content.notifications.enabled:
    https://mail.proton.me: false
    https://wowroms.com: false
    https://www.reddit.com: false
    https://www.youtube.com: false
  content.register_protocol_handler:
    https://mail.proton.me#mailto=%25s: false
  downloads.location.suggestion:
    global: both
  downloads.remove_finished:
    global: 3
  input.insert_mode.auto_enter:
    global: false
  prompt.filebrowser:
    global: true
  scrolling.bar:
    global: always
  search.ignore_case:
    global: always
